[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediatrans"
dynamic = ["version"]
description = "Convert Apple HEIC photos and MOV videos to universal formats while preserving EXIF, GPS and device metadata — with a bilingual desktop UI and a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kelvin-LH" }]
keywords = ["heic", "mov", "mp4", "jpg", "webp", "avif", "exif", "gps",
            "metadata", "converter", "apple", "iphone", "image", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "pillow-heif>=0.13",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/Kelvin-LH/MediaTrans"
Repository = "https://github.com/Kelvin-LH/MediaTrans"
Issues = "https://github.com/Kelvin-LH/MediaTrans/issues"
Changelog = "https://github.com/Kelvin-LH/MediaTrans/blob/main/CHANGELOG.md"

[project.scripts]
mediatrans = "app.cli:main"

[project.gui-scripts]
mediatrans-gui = "app.ui:run_app"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["dist", "build", "_artifact", "_rel*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are tolerated in QSS blocks and message strings
    "SIM108", # ternaries are not always clearer
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path bootstrap happens before imports
