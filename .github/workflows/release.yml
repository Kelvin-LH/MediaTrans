name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            python: "3.12"
          - os: macos-14
            artifact: macos-arm64
            python: "3.12"
          - os: macos-13
            artifact: macos-x64
            python: "3.12"
          - os: ubuntu-latest
            artifact: linux-x64
            python: "3.12"

    env:
      WIN_CERT_B64: ${{ secrets.WINDOWS_CERT_B64 }}
      WIN_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MAC_CERT_B64: ${{ secrets.MACOS_CERT_B64 }}
      MAC_CERT_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed --name MediaTrans \
            --icon MediaTrans.ico \
            --collect-all pillow_heif --collect-all imageio_ffmpeg run.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name MediaTrans \
            --icon MediaTrans.ico \
            --collect-all pillow_heif --collect-all imageio_ffmpeg run.py

      - name: Sign binaries (Windows)
        if: runner.os == 'Windows' && env.WIN_CERT_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } |
            Select-Object -First 1 -ExpandProperty FullName
          $targets = Get-ChildItem "dist\MediaTrans" -Recurse -Include *.exe, *.dll |
            Select-Object -ExpandProperty FullName
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfx /p "$env:WIN_CERT_PASS" $targets
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx -Force

      - name: Sign app (macOS)
        if: runner.os == 'macOS' && env.MAC_CERT_B64 != ''
        shell: bash
        run: |
          echo "$MAC_CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p build123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build123 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$MAC_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build123 build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          echo "Signing with: $IDENTITY"
          codesign --deep --force --options runtime --timestamp \
            --entitlements packaging/entitlements.plist \
            --sign "$IDENTITY" dist/MediaTrans.app
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Notarize app (macOS, optional)
        if: runner.os == 'macOS' && env.MAC_CERT_B64 != '' && env.APPLE_ID != ''
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc dist/MediaTrans.app "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/MediaTrans.app

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="dev"
          NAME="MediaTrans-${VERSION}-${{ matrix.artifact }}"
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent MediaTrans.app "../${NAME}.zip"
          else
            python -c "import shutil; shutil.make_archive('../${NAME}', 'zip', '.', 'MediaTrans')"
          fi
          cd ..
          echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
